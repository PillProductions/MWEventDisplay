<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Event Screen Setup</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ============ SETUP PANEL ============ -->
  <section id="setup">
    <div class="setup-card">
      <header class="setup-head">
        <div class="setup-head-text">
          <h1>Event Screen</h1>
          <p class="setup-sub">Configure your display, then press play to launch on every screen.</p>
        </div>
      </header>

      <form id="setupForm">

        <!-- SAVED TEMPLATES (shown only when at least one exists) -------->
        <div id="templateBar" class="template-bar hidden">
          <span class="template-bar-icon" aria-hidden="true">★</span>
          <label class="template-select-label">
            <span>Load a saved template</span>
            <select id="templateSelect"></select>
          </label>
          <button type="button" id="loadTemplateBtn" class="ghost-btn">Load</button>
          <button type="button" id="deleteTemplateBtn" class="ghost-btn danger" title="Delete template">Delete</button>
        </div>

        <!-- INTRO LOGO ----------------------------------------------------->
        <div class="field-group" data-section="logo">
          <div class="field-header">
            <span class="field-label">Intro logo</span>
            <label class="switch" title="Show / hide">
              <input type="checkbox" id="toggleLogo" checked>
              <span class="slider round"></span>
            </label>
          </div>

          <input type="file" accept="image/*" id="logoInput" class="file-native">
          <div id="logoPreview" class="logo-preview"><!-- rendered by JS --></div>
        </div>

        <!-- EVENT NAME ----------------------------------------------------->
        <div class="field-group" data-section="title">
          <div class="field-header">
            <span class="field-label">Event name / intro title</span>
            <label class="switch" title="Show / hide">
              <input type="checkbox" id="toggleTitle" checked>
              <span class="slider round"></span>
            </label>
          </div>

          <textarea id="eventName" rows="2" placeholder="Company Retreat"
          class="wide-input"></textarea>
        </div>

        <!-- WI-FI DETAILS --------------------------------------------------->
        <div class="field-group" data-section="wifi">
          <div class="field-header">
            <span class="field-label">Wi-Fi details</span>
            <label class="switch" title="Show / hide">
              <input type="checkbox" id="toggleWifi" checked>
              <span class="slider round"></span>
            </label>
          </div>

          <div class="field-grid">
            <label class="input-label">Network (SSID)
              <input type="text" id="ssid"
                     value="Guest Moalem Weitemeyer"
                     class="wide-input" required />
            </label>

            <label class="input-label">Password
              <input type="text" id="wifiPw"
                     value="xxx"
                     class="wide-input" required />
            </label>
          </div>
        </div>

        <!-- TODAY’S PROGRAM ------------------------------------------------->
        <div class="field-group" data-section="program">
          <div class="field-header">
            <span class="field-label">Today's program</span>
            <label class="switch" title="Show / hide">
              <input type="checkbox" id="toggleProgram" checked>
              <span class="slider round"></span>
            </label>
          </div>

          <div id="programSection">
            <div id="programList">
              <!-- starter row -->
              <div class="progRow">
                <input type="time"  class="progTime"  value="09:00">
                <input type="text"  class="progTitle"
                       placeholder="Welcome coffee">
                <button type="button" class="removeRow" title="Remove">✕</button>
              </div>
            </div>

            <button type="button" id="addRow">+ Add entry</button>
          </div>
        </div>

        <!-- REMINDER 1 ------------------------------------------------------>
        <div class="field-group" data-section="rem1">
          <div class="field-header">
            <span class="field-label">Reminder line 1</span>
            <label class="switch" title="Show / hide">
              <input type="checkbox" id="toggleRem1" checked>
              <span class="slider round"></span>
            </label>
          </div>

          <textarea id="line1" rows="2"
          class="wide-input">PLEASE PUT YOUR PHONE ON SILENT</textarea>
        </div>

        <!-- REMINDER 2 ------------------------------------------------------>
        <div class="field-group" data-section="rem2">
          <div class="field-header">
            <span class="field-label">Reminder line 2</span>
            <label class="switch" title="Show / hide">
              <input type="checkbox" id="toggleRem2" checked>
              <span class="slider round"></span>
            </label>
          </div>

          <textarea id="line2" rows="2"
          class="wide-input">WE HOPE YOU ENJOY THE EVENT</textarea>
        </div>

        <!-- BACKGROUND IMAGES --------------------------------------------->
        <div class="field-group" data-section="bg">
          <div class="field-header">
            <span class="field-label">Background images</span>
            <span class="field-count" id="slideCount"></span>
          </div>

          <input type="file" accept="image/*" id="bgInput" multiple class="file-native">
          <div id="slideGallery" class="slide-gallery"><!-- rendered by JS --></div>

          <div class="gallery-actions">
            <button type="button" id="addDefaultsBtn" class="ghost-btn">+ Add default slides</button>
            <small class="dropzone-hint">Drag to reorder · default slideshow shown if empty</small>
          </div>
        </div>

        <!-- ADJUSTABLE TIMING --------------------------------------------->
        <div class="field-group" data-section="timing">
          <div class="field-header">
            <span class="field-label">Timing</span>
          </div>

          <div class="field-grid">
            <label class="input-label">Background duration
              <span class="input-affix">
                <input type="number" id="bgSeconds" value="30" min="3" step="1">
                <span class="affix-unit">sec</span>
              </span>
            </label>

            <label class="input-label">Text duration
              <span class="input-affix">
                <input type="number" id="cueSeconds" value="16" min="3" step="1">
                <span class="affix-unit">sec</span>
              </span>
            </label>
          </div>
        </div>

        <div class="setup-actions">
          <div id="templateSaveRow" class="template-save-row hidden">
            <input type="text" id="templateName" class="wide-input" placeholder="Template name (e.g. Monday Standup)" maxlength="60">
            <button type="button" id="confirmSaveTemplate" class="ghost-btn accent">Save</button>
            <button type="button" id="cancelSaveTemplate" class="ghost-btn">Cancel</button>
          </div>
          <div class="action-buttons">
            <button type="button" id="saveTemplateBtn" class="ghost-btn">★ Save as template</button>
            <button type="submit" class="play-btn">
              <span class="play-icon" aria-hidden="true">▶</span> Play
            </button>
          </div>
        </div>
      </form>
    </div>
  </section>


  
  <!-- ============ PLAYER LAYER (initially hidden) ============ -->
  <section id="player" class="hidden">
    <div id="bgContainer"></div>
    <div id="bgOverlay"></div>
    <div id="loadingOverlay" class="hidden"><div class="spinner"></div></div>
    <button id="fsBtn"   title="Toggle full-screen">⛶</button>   <!-- NEW -->
    <button id="editBtn" title="Edit setup">⚙️</button>
    <button id="copyUrlBtn" title="Copy share link">🔗</button>

    <!-- foreground cue wrappers -->
    <img id="logo"   class="cue" />
    <h1  id="title"  class="cue"></h1>
    <div id="wifi"   class="cue"></div>
    <div id="programBlock" class="cue"></div>
    <h2  id="rem1"   class="cue"></h2>
    <h2  id="rem2"   class="cue"></h2>
  </section>

  <script src="player.js"></script>
</body>
</html>
